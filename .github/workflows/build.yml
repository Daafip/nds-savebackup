name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: PC tests
        run: bash tests/run_tests.sh

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build savebackup.nds
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            skylyrac/blocksds:slim-v1.25.0@sha256:c5f19b95d9c2f312e6a68ea244d2ed5120203b4b82af9785937a349096f8e5e4 \
            make
          sha256sum savebackup.nds > SHA256SUMS.txt
      - name: Upload savebackup.nds
        uses: actions/upload-artifact@v7
        with:
          name: savebackup-${{ github.sha }}
          path: |
            savebackup.nds
            SHA256SUMS.txt
          if-no-files-found: error
